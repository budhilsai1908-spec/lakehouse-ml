services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:16
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark:
    image: apache/spark:3.5.3
    container_name: lakehouse-spark
    depends_on:
      - minio
      - postgres
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../spark:/opt/spark/work-dir/jobs
      - ../data:/opt/spark/work-dir/data
      - spark-ivy:/home/spark/.ivy2
    entrypoint: ["tail", "-f", "/dev/null"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: lakehouse-mlflow
    depends_on:
      - minio
      - postgres
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
    command: >
      bash -c "pip install psycopg2-binary boto3 &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://iceberg:iceberg123@postgres:5432/mlflow
      --artifacts-destination s3://mlflow/"

  ray:
    image: rayproject/ray:2.37.0-py310
    container_name: lakehouse-ray
    depends_on:
      - mlflow
      - minio
    ports:
      - "8000:8000"
      - "8265:8265"
    shm_size: "4gb"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
    volumes:
      - ../serving:/app
    working_dir: /app
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  minio-data:
  postgres-data:
  spark-ivy:
